name: encore-dev

x-listmonk-env: &listmonk-env
  LISTMONK_app__address: 0.0.0.0:9000
  LISTMONK_db__host: db
  LISTMONK_db__port: "5432"
  LISTMONK_db__user: listmonk
  LISTMONK_db__password: listmonk
  LISTMONK_db__database: listmonk
  LISTMONK_db__ssl_mode: disable

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: listmonk
      POSTGRES_PASSWORD: listmonk
      POSTGRES_DB: listmonk
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U listmonk -d listmonk"]
      interval: 2s
      timeout: 3s
      retries: 30

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "${MAILPIT_UI_PORT:-8025}:8025"
      - "${MAILPIT_SMTP_PORT:-1025}:1025"

  listmonk:
    image: listmonk/listmonk:v6.2.0
    depends_on:
      db:
        condition: service_healthy
    environment:
      <<: *listmonk-env
    ports:
      - "${LISTMONK_PORT:-9001}:9000"
    volumes:
      - uploads:/listmonk/uploads
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9000/api/public/lists"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  # One-shot: wipe and install the listmonk schema, admin user, and sample data.
  install:
    image: listmonk/listmonk:v6.2.0
    profiles: ["init"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      <<: *listmonk-env
      LISTMONK_ADMIN_USER: admin
      LISTMONK_ADMIN_PASSWORD: adminpass
    command: ["./listmonk", "--install", "--yes"]
    restart: "no"

  # One-shot: fixed API token, Mailpit SMTP, deterministic demo data.
  seed:
    image: postgres:17-alpine
    profiles: ["init"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGPASSWORD: listmonk
    volumes:
      - ./dev/seed.sql:/seed.sql:ro
    command:
      - psql
      - -h
      - db
      - -U
      - listmonk
      - -d
      - listmonk
      - -v
      - ON_ERROR_STOP=1
      - -f
      - /seed.sql
    restart: "no"

volumes:
  pgdata:
  uploads:
