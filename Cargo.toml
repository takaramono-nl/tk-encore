[package]
name    = "encore-listmonk"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
description = "Resend-cohort orchestrator for listmonk"

[[bin]]
name = "encore"
path = "src/main.rs"

[lib]
name = "encore_listmonk"
path = "src/lib.rs"

[dependencies]
tokio        = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
clap         = { version = "4.6", features = ["derive", "wrap_help"] }
reqwest      = { version = "0.13", default-features = false, features = ["json", "rustls", "gzip", "http2"] }
serde        = { version = "1", features = ["derive"] }
serde_json   = "1"
sqlx         = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "migrate"] }
thiserror    = "2"
tracing      = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url          = "2"
chrono       = { version = "0.4", features = ["serde"] }
secrecy      = "0.10"
dirs         = "7"
toml         = "1.1"

[dev-dependencies]
wiremock = "0.6"
tempfile = "3"
